<style>
  /* Fallback billboard (moving) */
  .ad-fallback {
    position: absolute;
    inset: 0;
    display: block;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .marquee {
    --speed: 18s;
    /* adjust speed */
    --dir: -1;
    /* -1 = left, 1 = right */
    display: flex;
    gap: 2rem;
    white-space: nowrap;
    will-change: transform;
    animation: scroll var(--speed) linear infinite;
  }

  .marquee span {
    font-weight: 800;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, .92);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    font-size: clamp(12px, 2.2vw, 18px);
  }

  @keyframes scroll {
    from {
      transform: translateX(0);
    }

    to {
      transform: translateX(calc(var(--dir) * -50%));
    }
  }

  /* Hide fallback when ad confirms it has content */
  .ad-slot.has-ad .ad-fallback {
    display: none;
  }

  /* Hide entire slot if ad reports empty (JS toggles display:none) */
</style>
<script>
const hasAdContent = document.querySelector('.ad-banner, .ad-content');
window.parent.postMessage({
    type: 'mayweb-ad-status',
    present: !!hasAdContent
}, '*');
</script>
